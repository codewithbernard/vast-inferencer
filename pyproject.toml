[project]
name = "vast-inferencer"
version = "0.1.0"
description = "FastAPI control plane for Vast Serverless ComfyUI generations."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "cryptography>=44.0.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "qstash>=3.4.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "vastai>=1.8.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15.0",
    "ruff>=0.11.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vast_inferencer = ["playground/*.html", "admin/*.html"]

[tool.vercel]
entrypoint = "src.app:app"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/app.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
packages = ["vast_inferencer"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
